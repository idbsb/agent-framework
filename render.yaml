services:
  - type: web
    name: challenge-cup-agent-framework-api
    runtime: python
    branch: main
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/jobs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: P1_ENV
        value: local
      - key: P1_FREE_READONLY
        value: "1"
      - key: P1_CLOSURE_WRITES
        value: "0"
      - key: CORS_ORIGINS
        value: ""
